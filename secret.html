<!-- 1. 비밀번호 입력 영역 -->
<div id="auth-container" style="max-width: 400px; margin: 4rem auto; text-align: center;">
  <h2>🔒 Private Area</h2>
  <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 1.5rem;">비밀번호를 입력해 주세요.</p>
  
  <!-- form 태그 제거로 페이지 이동/새로고침 원천 차단 -->
  <div style="margin-bottom: 1rem;">
    <input type="password" id="pw-input" placeholder="Password" 
           style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(148,163,184,0.3); background: var(--card-bg, inherit); color: inherit; margin-bottom: 1rem; box-sizing: border-box;">
    <button type="button" id="login-btn"
            style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer;">
      접속하기
    </button>
  </div>
  <p id="error-msg" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.75rem; display: none;">비밀번호가 틀렸습니다.</p>
</div>

<!-- 2. 인증 성공 후 보여질 비밀 콘텐츠 영역 (처음엔 숨김 처리) -->
<div id="secret-content" style="display: none;">
  <h1>🤫 은밀한 소장 문서고</h1>
  <p>여기에 비공개로 기록할 내용들을 적어두시면 됩니다.</p>
  <!-- 원하는 비공개 본문 내용을 이 아래에 작성하세요 -->
</div>

<script>
  function handleLogin() {
    const inputPw = document.getElementById('pw-input').value;
    const correctPw = "1234"; // 👈 여기에 원하시는 비밀번호를 설정하세요!
    
    if (inputPw === correctPw) {
      // 인증 성공 시 입력 상자 영역 숨기고 비밀 콘텐츠 노출
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('secret-content').style.display = 'block';
    } else {
      // 인증 실패 시 에러 메시지 띄우고 입력창 초기화
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'block';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  }

  // 접속하기 버튼 클릭 시 실행
  document.getElementById('login-btn').addEventListener('click', handleLogin);

  // 비밀번호 입력란에서 엔터키(Enter)를 쳤을 때도 바로 로그인 처리
  document.getElementById('pw-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      handleLogin();
    }
  });
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Archive | Naru.logs</title>
  <style>
    body {
      background-color: #1b1b1e;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 680px;
    }
    .auth-box {
      max-width: 360px;
      margin: 0 auto;
      text-align: center;
      background: #27272a;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      border: 1px solid #3f3f46;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem 0;
      border-radius: 0.5rem;
      border: 1px solid #52525b;
      background: #18181b;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. 비밀번호 입력 영역 -->
  <div id="auth-container" class="auth-box">
    <h2 style="margin-top: 0;">🔒 Private Area</h2>
    <p style="font-size: 0.9rem; color: #a1a1aa;">비밀번호를 입력해 주세요.</p>
    
    <input type="password" id="pw-input" placeholder="Password">
    <button type="button" id="login-btn">접속하기</button>
    
    <p id="error-msg" style="color: #f87171; font-size: 0.85rem; margin-top: 0.75rem; display: none;">
      비밀번호가 틀렸습니다.
    </p>
    <a href="/" class="back-link">&larr; 메인으로 돌아가기</a>
  </div>

  <!-- 2. 인증 성공 후 보여질 비밀 콘텐츠 영역 -->
  <div id="secret-content" style="display: none; background: #27272a; padding: 2.5rem; border-radius: 1rem; border: 1px solid #3f3f46;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3f3f46; padding-bottom: 1rem; margin-bottom: 1.5rem;">
      <h1 style="margin: 0; font-size: 1.5rem;">🤫 은밀한 소장 문서고</h1>
      <a href="/" class="back-link" style="margin: 0;">메인으로 &rarr;</a>
    </div>
    
    <!-- 여기에 비공개 기록들을 작성하시면 됩니다 -->
    <p style="line-height: 1.6;">인증에 성공했습니다. 이곳에 비공개 개인 문서나 회고록을 안전하게 기록해 두세요.</p>
  </div>
</div>

<script>
  const btn = document.getElementById('login-btn');
  const input = document.getElementById('pw-input');
  const errorMsg = document.getElementById('error-msg');
  const correctPw = "1234"; // 👈 원하시는 비밀번호로 변경하세요!

  function checkAuth() {
    if (input.value === correctPw) {
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('secret-content').style.display = 'block';
    } else {
      errorMsg.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', checkAuth);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAuth();
  });
</script>

</body>
</html>

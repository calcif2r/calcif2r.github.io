<div style="max-width: 400px; margin: 4rem auto; text-align: center; padding: 2rem; border-radius: 1rem; border: 1px solid rgba(148,163,184,0.2);">
  <h3 style="margin-bottom: 1.5rem;">🔒 Restricted Area</h3>
  <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 1.5rem;">비공개 아카이브 접근을 위해 비밀번호를 입력하세요.</p>
  
  <!-- 비밀번호 입력 폼 -->
  <div style="display: flex; gap: 0.5rem; justify-content: center;">
    <input type="password" id="sec-pw" placeholder="Password" style="padding: 0.5rem 1rem; border-radius: 0.5rem; border: 1px solid rgba(148,163,184,0.4); background: transparent; color: inherit; outline: none;" onkeydown="if(event.key === 'Enter') checkPassword();">
    <button onclick="checkPassword()" style="padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: bold;">확인</button>
  </div>
  
  <!-- 피드백 메시지 출력 영역 (무반응 차단용) -->
  <p id="error-msg" style="color: #ef4444; font-size: 0.85rem; margin-top: 1rem; display: none;">비밀번호가 올바르지 않습니다.</p>
</div>

<script>
  function checkPassword() {
    const inputVal = document.getElementById('sec-pw').value;
    const errorMsg = document.getElementById('error-msg');
    
    // 설정하실 비밀번호를 지정하세요 (예: "1234" 또는 본인만의 패스워드)
    const correctPassword = "YOUR_SECRET_PASSWORD"; 
    
    if (inputVal === correctPassword) {
      // 인증 성공 시 세션 스토리지에 기록 후 본문 표시 또는 콘텐츠 로드
      sessionStorage.setItem('s_auth', 'true');
      alert("인증되었습니다.");
      location.reload(); // 새로고침하여 전체 콘텐츠 노출
    } else {
      // 틀렸을 때 무반응 대신 명확한 에러 문구 노출
      errorMsg.style.display = 'block';
      document.getElementById('sec-pw').value = '';
      document.getElementById('sec-pw').focus();
    }
  }
</script>

<script>
  (function() {
    // ★ 원하시는 4자리 숫자 비밀번호로 아래 값을 변경하세요
    const SECRET_PIN = "1086"; 

    const lockScreen = document.getElementById("lockScreen");
    const secretContent = document.getElementById("secretContent");
    const pinInput = document.getElementById("pinInput");
    const unlockBtn = document.getElementById("unlockBtn");
    const lockBtn = document.getElementById("lockBtn");
    const pinError = document.getElementById("pinError");

    function showContent() {
      lockScreen.style.display = "none";
      secretContent.style.display = "block";
      sessionStorage.setItem("calcif2r_unlocked", "true");
    }

    function lockContent() {
      sessionStorage.removeItem("calcif2r_unlocked");
      secretContent.style.display = "none";
      lockScreen.style.display = "block";
      pinInput.value = "";
      pinError.style.display = "none";
    }

    function checkPin() {
      if (pinInput.value === SECRET_PIN) {
        pinError.style.display = "none";
        showContent();
      } else {
        pinError.style.display = "block";
        pinInput.value = "";
        pinInput.focus();
      }
    }

    // 현재 브라우저 탭에서 이미 잠금 해제한 경우 자동 유지
    if (sessionStorage.getItem("calcif2r_unlocked") === "true") {
      showContent();
    }

    unlockBtn.addEventListener("click", checkPin);
    lockBtn.addEventListener("click", lockContent);
    pinInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") checkPin();
    });
    // 4자리 입력 완료 시 자동 확인
    pinInput.addEventListener("input", function() {
      if (pinInput.value.length === 4) checkPin();
    });
  })();
</script>

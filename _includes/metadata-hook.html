<!-- 이메일 복사 팝업 모달 -->
<div id="email-modal" style="display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, 0.65); align-items: center; justify-content: center; backdrop-filter: blur(2px);">
  <div style="background: #27272a; border: 1px solid #3f3f46; border-radius: 12px; padding: 1.75rem; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); color: #f4f4f5;">
    <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">✉️</div>
    <h3 style="margin: 0 0 0.4rem 0; font-size: 1.1rem; color: #fff;">Contact Email</h3>
    <p style="margin: 0 0 1.25rem 0; font-size: 0.85rem; color: #a1a1aa;">아래 버튼을 누르면 주소가 복사됩니다.</p>
    
    <div style="background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; padding: 0.7rem; font-family: monospace; font-size: 0.95rem; color: #60a5fa; margin-bottom: 1rem; user-select: all;">
      naru.logs@gmail.com
    </div>
    
    <div style="display: flex; gap: 0.5rem;">
      <button type="button" id="modal-copy-btn" style="flex: 1; padding: 0.65rem; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer;">
        주소 복사하기
      </button>
      <button type="button" id="modal-close-btn" style="padding: 0.65rem 1rem; border: 1px solid #3f3f46; border-radius: 8px; background: #18181b; color: #a1a1aa; font-size: 0.9rem; cursor: pointer;">
        닫기
      </button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const emailAddress = "naru.logs@gmail.com";
  const modal = document.getElementById("email-modal");
  const copyBtn = document.getElementById("modal-copy-btn");
  const closeBtn = document.getElementById("modal-close-btn");

  // 좌측 하단 이메일 아이콘(mailto 링크) 가로채기
  document.querySelectorAll('.sidebar-bottom a[href^="mailto:"]').forEach(link => {
    link.removeAttribute("href");
    link.style.cursor = "pointer";
    link.addEventListener("click", function(e) {
      e.preventDefault();
      copyBtn.textContent = "주소 복사하기";
      copyBtn.style.background = "#3b82f6";
      modal.style.display = "flex";
    });
  });

  // 복사 버튼 클릭 동작
  copyBtn.addEventListener("click", function() {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(emailAddress);
    } else {
      const temp = document.createElement("input");
      temp.value = emailAddress;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
    }
    copyBtn.textContent = "✅ 복사 완료!";
    copyBtn.style.background = "#10b981";
    setTimeout(() => {
      modal.style.display = "none";
    }, 900);
  });

  // 닫기 버튼 및 바깥 배경 클릭 시 닫기
  closeBtn.addEventListener("click", () => modal.style.display = "none");
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.style.display = "none";
  });
});
</script>

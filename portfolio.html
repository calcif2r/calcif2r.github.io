---
layout: page
title: Portfolio
permalink: /portfolio/
---

<div class="list-content">
  <ul class="content-list">
    {% for item in site.portfolio %}
      <li class="post-item" style="margin-bottom: 1.5rem; list-style: none;">
        <a href="{{ item.url }}" style="font-size: 1.2rem; font-weight: bold; text-decoration: none;">
          {{ item.title }}
        </a>
        {% if item.date %}
          <div style="font-size: 0.85rem; opacity: 0.7; margin-top: 0.2rem;">
            {{ item.date | date: "%Y-%m-%d" }}
          </div>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</div>

# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: ko-KR

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Seoul

# ↓ --------------------------

title: Naru.logs # the main title

tagline: Portfolio & Archive # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  개인 포트폴리오와 기록을 위한 아카이브입니다.

# Fill in the protocol & hostname for your site.
url: "https://calcif2r.github.io"

github:
  username: calcif2r # change to your GitHub username

social:
  name: Naru
  email: naru.logs@gmail.com
  links:
    - https://github.com/calcif2r
    - https://www.linkedin.com/in/seongjo-heo-a395a214a

# Site Verification Settings
webmaster_verifications:
  google: 
  bing: 
  alexa: 
  yandex: 
  baidu: 
  facebook: 

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: 
  goatcounter:
    id: 
  umami:
    id: 
    domain: 
  matomo:
    id: 
    domain: 
  cloudflare:
    id: 
  fathom:
    id: 

# Page views settings
pageviews:
  provider: 

theme_mode: 

cdn:

# the avatar on sidebar, support local or CORS resources
avatar: '/assets/img/denia.png'

social_preview_image: 

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: 
  disqus:
    shortname: 
  utterances:
    repo: 
    issue_term: 
  giscus:
    repo: 
    repo_id:
    category:
    category_id:
    mapping: 
    strict: 
    input_position: 
    lang: 
    reactions_enabled: 

assets:
  self_host:
    enabled: 
    env: 

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# 컬렉션 설정 통합 (Portfolio, Side-Project, Secret, tabs)
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
  sideproject:
    output: true
    permalink: /side-project/:path/
  secret:
    output: true
    permalink: /secret/:path/
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

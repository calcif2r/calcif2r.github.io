# The Site Configuration
theme: jekyll-theme-chirpy
lang: ko-KR
timezone: Asia/Seoul

# 사이트 기본 정보
title: Naru.logs
tagline: Portfolio & Archive
description: >-
  개인 포트폴리오와 기록을 위한 아카이브입니다.

url: "https://calcif2r.github.io"
baseurl: ""

social:
  name: Naru
  email: naru.logs@gmail.com
  links:
    - https://www.linkedin.com/in/seongjo-heo-a395a214a

# 프로필 및 UI 기본 설정
avatar: '/assets/img/denia.png'
toc: true
paginate: 10

pwa:
  enabled: false

# 컬렉션 설정 통합 (Portfolio, SideProject, Secret, tabs)
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
  sideproject:
    output: true
    permalink: /side-project/:path/
  secret:
    output: false
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# 빌드 및 마크다운 엔진 설정 (테마 기본 필수 영역)
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
